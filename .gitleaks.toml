# gitleaks configuration for redteam-agent. Extends the default ruleset and adds
# the Discord webhook rule shared by every Pirates.RE repository
# (jarvis baseline/README.md, B4/B5).
title = "redteam-agent"

[extend]
useDefault = true

[[rules]]
id = "discord-webhook-url"
description = "Discord webhook URL (id + token)"
regex = '''https://(?:canary\.|ptb\.)?discord(?:app)?\.com/api/webhooks/[0-9]{17,20}/[A-Za-z0-9_-]{60,}'''
keywords = ["discord.com/api/webhooks", "discordapp.com/api/webhooks"]
